<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Глаз дракона - Чтение</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo" id="site-title">Глаз дракона</div>
        
        <div class="controls">
            <!-- Кнопка смены языка -->
            <button id="lang-btn" class="btn">RU</button>
            <!-- Кнопка смены темы -->
            <button id="theme-btn" class="btn theme-btn">
                <span id="theme-icon">🌙</span> <span id="theme-text">Темная</span>
            </button>
        </div>
    </header>

    <main class="main-content">
        <h1 id="chapters-title">Главы</h1>
        
        <div class="chapters-grid">
            <!-- Карточка 1 -->
            <a href="glava1.html" class="chapter-card">
                <!-- Замени ссылку ниже на свою картинку -->
                <img src="https://i.postimg.cc/2SJvHbLJ/Bez-nazvania125-20261111215346.png" alt="Глава 1">
                <div class="card-overlay">
                    <span class="chapter-number" data-ru="Том 1 Глава 1" data-en="Volume 1 Chapter 1">Том 1 Глава 1</span>
                </div>
            </a>

            <!-- Карточка 2 -->
            <a href="glava1.html" class="chapter-card">
                <!-- Замени ссылку ниже на свою картинку -->
                <img src="https://i.postimg.cc/2SJvHbLJ/Bez-nazvania125-20261111215346.png" alt="Глава 2">
                <div class="card-overlay">
                    <span class="chapter-number" data-ru="Глава 2" data-en="Chapter 2">Глава 2</span>
                </div>
            </a>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
